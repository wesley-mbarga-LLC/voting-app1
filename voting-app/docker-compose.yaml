services:
  db:
    image: postgres:alpine
    env_file:
      - .env.db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    deploy:
      replicas: 1
    networks:
      - s5wesley
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    deploy:
      replicas: 1
    networks:
      - s5wesley
    restart: always

  vote:
    image: dockersamples/examplevotingapp_vote
    ports:
      - "0.0.0.0:5002:80"  # Ensure external access
    environment:
      REDIS_HOST: redis
    deploy:
      replicas: 1
    networks:
      - s5wesley
    restart: always

  worker:
    image: dockersamples/examplevotingapp_worker
    deploy:
      replicas: 1
    networks:
      - s5wesley
    restart: always

  result:
    image: dockersamples/examplevotingapp_result
    ports:
      - "0.0.0.0:5001:80"  # Ensure external access
    env_file:
      - .env.result
    deploy:
      replicas: 1
    networks:
      - s5wesley
    restart: always

volumes:
  redis-data:
  db-data:

networks:
  s5wesley:
